  <!-- Lightbox modal -->

    <button id="lb-close" class="absolute top-6 right-6 text-white text-2xl">&times;</button>
    <button id="lb-prev" class="absolute left-6 text-white text-3xl">&#10094;</button>
    <img id="lb-image" src="" alt="" class="modal-img rounded-lg shadow-2xl">
    <button id="lb-next" class="absolute right-6 text-white text-3xl">&#10095;</button>
  </div>

  <script>
    // Gather gallery sources from grid images
    const thumbs = Array.from(document.querySelectorAll('#gallery img'));
    const sources = thumbs.map(img => img.getAttribute('src'));
    const lightbox = document.getElementById('lightbox');
    const lbImage = document.getElementById('lb-image');
    let current = 0;

    function openLightbox(index) {
      current = index;
      lbImage.src = sources[current];
      lightbox.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.add('hidden');
      lbImage.src = '';
      document.body.style.overflow = '';
    }
    function prev() { current = (current - 1 + sources.length) % sources.length; lbImage.src = sources[current]; }
    function next() { current = (current + 1) % sources.length; lbImage.src = sources[current]; }

    thumbs.forEach((t, i) => t.addEventListener('click', () => openLightbox(i)));
    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', prev);
    document.getElementById('lb-next').addEventListener('click', next);
    window.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('hidden')) return;
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'Escape') closeLightbox();
    });

    // Click outside image closes
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

    const featuredTrack = document.getElementById('featured-track');
    const featuredSlides = Array.from(featuredTrack.children);
    const featuredCarousel = document.getElementById('featured-carousel');
    let featuredIndex = 0;
    let featuredTimer;

    function showFeatured(index) {
      const maxScroll = featuredTrack.scrollWidth - featuredTrack.clientWidth;
      const maxIndex = featuredSlides.reduce((lastVisibleIndex, slide, slideIndex) => {
        const slideOffset = slide.offsetLeft - featuredTrack.offsetLeft;
        return slideOffset <= maxScroll + 1 ? slideIndex : lastVisibleIndex;
      }, 0);
      const startCount = maxIndex + 1;
      featuredIndex = (index % startCount + startCount) % startCount;
      const slideOffset = featuredSlides[featuredIndex].offsetLeft - featuredTrack.offsetLeft;
      const targetOffset = featuredIndex === maxIndex ? maxScroll : slideOffset;
      featuredTrack.scrollTo({ left: targetOffset, behavior: 'smooth' });
    }

    function startFeaturedAutoplay() {
      window.clearInterval(featuredTimer);
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      featuredTimer = window.setInterval(() => showFeatured(featuredIndex + 1), 4500);
    }

    document.getElementById('featured-prev').addEventListener('click', () => {
      showFeatured(featuredIndex - 1);
      startFeaturedAutoplay();
    });
    document.getElementById('featured-next').addEventListener('click', () => {
      showFeatured(featuredIndex + 1);
      startFeaturedAutoplay();
    });
    featuredCarousel.addEventListener('mouseenter', () => window.clearInterval(featuredTimer));
    featuredCarousel.addEventListener('mouseleave', startFeaturedAutoplay);
    featuredCarousel.addEventListener('focusin', () => window.clearInterval(featuredTimer));
    featuredCarousel.addEventListener('focusout', startFeaturedAutoplay);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) window.clearInterval(featuredTimer);
      else startFeaturedAutoplay();
    });
    startFeaturedAutoplay();
  </script>
